services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: novamarket
      POSTGRES_USER: novamarket
      POSTGRES_PASSWORD: novamarket
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novamarket"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://novamarket:novamarket@database:5432/novamarket
      SECRET_KEY: novamarket-local-docker-secret
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:

